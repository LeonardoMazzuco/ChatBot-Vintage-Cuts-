<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vintage Cuts — Assistente Virtual</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS em arquivo separado -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chat">
      <header class="header">
        <div class="avatar">
          <!-- ícone de tesoura, referência ao nome "Vintage Cuts" -->
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="6.5" cy="6.5" r="2.3" stroke="currentColor" stroke-width="1.8" />
            <circle cx="6.5" cy="17.5" r="2.3" stroke="currentColor" stroke-width="1.8" />
            <path d="M8.2 8.2L19 19M19 5L8.2 15.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </div>
        <div class="header-text">
          <div class="title">Vintage Cuts</div>
          <div class="subtitle">
            <span class="status checking" id="statusDot"></span>
            <span id="statusText">Verificando conexão...</span>
          </div>
        </div>

        <!-- Botão obrigatório: Nova Conversa -->
        <button class="new-chat" onclick="novaConversa()" aria-label="Iniciar nova conversa" title="Nova conversa">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4v6h6M20 20v-6h-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M5.5 15A7.5 7.5 0 0019 13.5M18.5 9A7.5 7.5 0 005 10.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema claro/escuro">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8" />
            <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.55 1.55M18.25 18.25l1.55 1.55M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.55-1.55M18.25 5.75l1.55-1.55" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 14.5a8.5 8.5 0 01-11-11 8.5 8.5 0 1011 11z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          </svg>
        </button>
      </header>

      <div class="messages" id="messages">
        <div class="message bot">
          <div class="bubble">
            Olá! 👋
            <br /><br />
            Sou o assistente virtual da Vintage Cuts. Como posso te ajudar hoje?
          </div>
        </div>
      </div>

      <footer class="footer">
        <div class="input-area">
          <input
            id="userInput"
            placeholder="Digite sua mensagem..."
            autocomplete="off"
          />
          <button class="send" onclick="sendMessage()" aria-label="Enviar mensagem">➤</button>
        </div>
      </footer>
    </div>

    <!-- JS em arquivo separado -->
    <script src="script.js"></script>
  </body>
</html>
